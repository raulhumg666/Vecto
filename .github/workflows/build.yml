name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Descomprimir proyecto
        run: |
          Z="$(ls Vectorizador-v*.zip | sort -V | tail -1)"
          echo "Usando: $Z"
          unzip -q -o "$Z"
      - name: Compilar APK
        run: |
          D="$(dirname "$(find . -name settings.gradle.kts | head -1)")"
          echo "Proyecto en: $D"
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vectorizador-APK
          path: "**/app-debug.apk"
